<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740"><rect width="600" height="740" fill="#f2f3e9"/><g font-family="Arial,sans-serif" fill="#173d3c"><text x="32" y="40" font-size="24" font-weight="bold">02 / Промышленный переход</text><text x="32" y="66" font-size="12">Вид сверху · продвижение вниз по схеме · 8 px = 1 ед.</text><rect x="242" y="36" width="96" height="120" fill="#b7cf9e" stroke="#668b77"/><rect x="194" y="168" width="192" height="112" fill="#b7cf9e" stroke="#668b77"/><rect x="198" y="304" width="56" height="80" fill="#b7cf9e" stroke="#668b77"/><rect x="326" y="304" width="56" height="80" fill="#b7cf9e" stroke="#668b77"/><rect x="194" y="408" width="192" height="112" fill="#b7cf9e" stroke="#668b77"/><rect x="206" y="276" width="40" height="24" fill="#92c5d2" stroke="#236d80" stroke-dasharray="4 3"/><rect x="330" y="280" width="48" height="16" fill="#e89b5d" /><circle cx="226" cy="320" r="9" fill="#a86a59" stroke="#173d3c"/><text x="239" y="324" font-size="12">В</text><circle cx="354" cy="472" r="9" fill="#a86a59" stroke="#173d3c"/><text x="367" y="476" font-size="12">В</text><circle cx="210" cy="472" r="9" fill="#f6e591" stroke="#173d3c"/><text x="223" y="476" font-size="12">Б</text><circle cx="370" cy="472" r="9" fill="#f6e591" stroke="#173d3c"/><text x="383" y="476" font-size="12">Б</text><circle cx="226" cy="352" r="9" fill="#e8af63" stroke="#173d3c"/><text x="239" y="356" font-size="12">У1</text><circle cx="354" cy="352" r="9" fill="#e8af63" stroke="#173d3c"/><text x="367" y="356" font-size="12">У2</text><circle cx="290" cy="80" r="9" fill="#ffffff" stroke="#173d3c"/><text x="303" y="84" font-size="12">Старт</text><circle cx="290" cy="224" r="9" fill="#84d7c9" stroke="#173d3c"/><text x="303" y="228" font-size="12">КТ</text><circle cx="290" cy="512" r="9" fill="#d5f482" stroke="#173d3c"/><text x="303" y="516" font-size="12">Выход</text><text x="32" y="610" font-size="13">КТ — контрольная точка; У — узел; Э — элемент питания</text><text x="32" y="635" font-size="13">В — охранник; Б — необязательный бонус</text><text x="32" y="660" font-size="13">Коричневый — преграда; оранжевый — ловушка</text><text x="32" y="685" font-size="13">Пунктир — движущаяся платформа; белое поле — разрыв</text><text x="32" y="714" font-size="11">Порядок боковых узлов свободный. Разрывы проходятся прыжком.</text></g></svg>