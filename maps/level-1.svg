<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740"><rect width="600" height="740" fill="#f2f3e9"/><g font-family="Arial,sans-serif" fill="#173d3c"><text x="32" y="40" font-size="24" font-weight="bold">01 / Учебный двор</text><text x="32" y="66" font-size="12">Вид сверху · продвижение вниз по схеме · 8 px = 1 ед.</text><rect x="242" y="32" width="96" height="112" fill="#b7cf9e" stroke="#668b77"/><rect x="250" y="160" width="80" height="80" fill="#b7cf9e" stroke="#668b77"/><rect x="242" y="264" width="96" height="96" fill="#b7cf9e" stroke="#668b77"/><rect x="242" y="352" width="96" height="176" fill="#b7cf9e" stroke="#668b77"/><rect x="246" y="349.2" width="88" height="5.6" fill="#bd8962" /><circle cx="274" cy="392" r="9" fill="#a86a59" stroke="#173d3c"/><text x="287" y="396" font-size="12">В</text><circle cx="322" cy="312" r="9" fill="#f6e591" stroke="#173d3c"/><text x="335" y="316" font-size="12">Б</text><circle cx="258" cy="464" r="9" fill="#f6e591" stroke="#173d3c"/><text x="271" y="468" font-size="12">Б</text><circle cx="290" cy="448" r="9" fill="#e8af63" stroke="#173d3c"/><text x="303" y="452" font-size="12">Э</text><circle cx="290" cy="80" r="9" fill="#ffffff" stroke="#173d3c"/><text x="303" y="84" font-size="12">Старт</text><circle cx="290" cy="320" r="9" fill="#84d7c9" stroke="#173d3c"/><text x="303" y="324" font-size="12">КТ</text><circle cx="290" cy="504" r="9" fill="#d5f482" stroke="#173d3c"/><text x="303" y="508" font-size="12">Выход</text><text x="32" y="610" font-size="13">КТ — контрольная точка; У — узел; Э — элемент питания</text><text x="32" y="635" font-size="13">В — охранник; Б — необязательный бонус</text><text x="32" y="660" font-size="13">Коричневый — преграда; оранжевый — ловушка</text><text x="32" y="685" font-size="13">Пунктир — движущаяся платформа; белое поле — разрыв</text><text x="32" y="714" font-size="11">Порядок боковых узлов свободный. Разрывы проходятся прыжком.</text></g></svg>